<svg width="2800" height="1600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Define gradients for better visual depth -->
    <linearGradient id="domainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E3F2FD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BBDEFB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="frontBoardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F5E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C8E6C9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rearBoardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF3E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE0B2;stop-opacity:1" />
    </linearGradient>
    <!-- Arrow markers for connections -->
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1976D2" />
    </marker>
  </defs>

  <!-- Title Section -->
  <rect x="0" y="0" width="2800" height="100" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <text x="1400" y="60" font-size="42" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle" fill="#37474F">
    X7WL Wheel Loader Robot - Distributed Control Architecture
  </text>

  <!-- Main Domain Controller Section -->
  <g id="domain-controller">
    <rect x="100" y="140" width="2600" height="680" rx="20" fill="url(#domainGrad)" stroke="#1976D2" stroke-width="2"/>
    <text x="1400" y="185" font-size="32" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle" fill="#37474F">
      CUAV X7Plus-WL Domain Controller
    </text>
    <text x="1400" y="215" font-size="20" font-family="Arial, sans-serif" text-anchor="middle" fill="#546E7A">
      Central Processing &amp; Decision Making Unit
    </text>

    <!-- Input Modules (Centered) -->
    <g id="input-modules">
      <rect x="800" y="250" width="400" height="100" rx="15" fill="#E3F2FD" stroke="#1976D2" stroke-width="1"/>
      <text x="1000" y="285" font-size="24" font-weight="bold" text-anchor="middle" fill="#37474F">VLA Proxy</text>
      <text x="1000" y="310" font-size="16" text-anchor="middle" fill="#546E7A">Vision-Language-Action</text>
      <text x="1000" y="330" font-size="16" text-anchor="middle" fill="#546E7A">AI Decision Interface</text>

      <rect x="1300" y="250" width="400" height="100" rx="15" fill="#E3F2FD" stroke="#1976D2" stroke-width="1"/>
      <text x="1500" y="285" font-size="24" font-weight="bold" text-anchor="middle" fill="#37474F">RC Controller</text>
      <text x="1500" y="310" font-size="16" text-anchor="middle" fill="#546E7A">Manual Override</text>
      <text x="1500" y="330" font-size="16" text-anchor="middle" fill="#546E7A">Remote Control Input</text>
    </g>

    <!-- Central Processing (Vertically aligned below Input Modules) -->
    <rect x="950" y="380" width="600" height="100" rx="15" fill="#FCE4EC" stroke="#C2185B" stroke-width="1"/>
    <text x="1250" y="415" font-size="24" font-weight="bold" text-anchor="middle" fill="#37474F">Operation Mode Manager</text>
    <text x="1250" y="440" font-size="16" text-anchor="middle" fill="#546E7A">State Machine: Auto ↔ Manual ↔ Emergency</text>
    <text x="1250" y="460" font-size="16" text-anchor="middle" fill="#546E7A">Decision Logic &amp; Safety Monitoring</text>

    <!-- Trajectory Planning (Vertically aligned below Central Processing) -->
    <rect x="1000" y="510" width="500" height="100" rx="15" fill="#FFF3E0" stroke="#F57C00" stroke-width="1"/>
    <text x="1250" y="545" font-size="24" font-weight="bold" text-anchor="middle" fill="#37474F">Trajectory Planner</text>
    <text x="1250" y="570" font-size="16" text-anchor="middle" fill="#546E7A">Chassis Path Planning</text>
    <text x="1250" y="590" font-size="16" text-anchor="middle" fill="#546E7A">End-Effector Coordination</text>

    <!-- Navigation EKF (Right side) -->
    <rect x="2100" y="380" width="400" height="100" rx="15" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1"/>
    <text x="2300" y="415" font-size="24" font-weight="bold" text-anchor="middle" fill="#37474F">Navigation EKF</text>
    <text x="2300" y="440" font-size="16" text-anchor="middle" fill="#546E7A">State Estimation</text>
    <text x="2300" y="460" font-size="16" text-anchor="middle" fill="#546E7A">Sensor Fusion</text>

    <!-- Communication Bridge (Vertically aligned at bottom) -->
    <rect x="650" y="640" width="1200" height="100" rx="15" fill="#E0F2F1" stroke="#00695C" stroke-width="1"/>
    <text x="1250" y="680" font-size="26" font-weight="bold" text-anchor="middle" fill="#37474F">uORB UART Bridge</text>
    <text x="1250" y="710" font-size="18" text-anchor="middle" fill="#546E7A">High-Speed Message Router &amp; Cross-Board Communication Protocol</text>

    <!-- Connection arrows within domain controller -->
    <line x1="1000" y1="350" x2="1150" y2="380" stroke="#1976D2" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="1500" y1="350" x2="1350" y2="380" stroke="#1976D2" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="1250" y1="480" x2="1250" y2="510" stroke="#1976D2" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="1250" y1="610" x2="1250" y2="640" stroke="#1976D2" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="1550" y1="430" x2="2100" y2="430" stroke="#4CAF50" stroke-width="2" stroke-dasharray="3,3"/>
  </g>

  <!-- NXT Front Board Section -->
  <g id="nxt-front-board">
    <rect x="100" y="860" width="1250" height="640" rx="20" fill="url(#frontBoardGrad)" stroke="#4CAF50" stroke-width="2"/>
    <text x="725" y="910" font-size="30" font-weight="bold" text-anchor="middle" fill="#37474F">
      HKUST NXT-Dual-WL Front Board
    </text>
    <text x="725" y="940" font-size="18" text-anchor="middle" fill="#546E7A">
      Front Actuation &amp; Sensor Processing Unit
    </text>

    <!-- uORB Proxy Hub -->
    <rect x="300" y="970" width="750" height="70" rx="12" fill="#E0F2F1" stroke="#00695C" stroke-width="1"/>
    <text x="675" y="1000" font-size="22" font-weight="bold" text-anchor="middle" fill="#37474F">uORB Proxy Hub</text>
    <text x="675" y="1025" font-size="16" text-anchor="middle" fill="#546E7A">Local Message Distribution &amp; Synchronization</text>

    <!-- Front Kinematics EKF -->
    <rect x="200" y="1070" width="320" height="130" rx="12" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1"/>
    <text x="360" y="1105" font-size="22" font-weight="bold" text-anchor="middle" fill="#37474F">Front Kinematics</text>
    <text x="360" y="1130" font-size="16" text-anchor="middle" fill="#546E7A">Local EKF</text>
    <text x="360" y="1150" font-size="16" text-anchor="middle" fill="#546E7A">Wheel Odometry</text>
    <text x="360" y="1170" font-size="16" text-anchor="middle" fill="#546E7A">Slip Detection</text>

    <!-- Control Modules -->
    <rect x="570" y="1070" width="280" height="130" rx="12" fill="#FFF3E0" stroke="#F57C00" stroke-width="1"/>
    <text x="710" y="1105" font-size="22" font-weight="bold" text-anchor="middle" fill="#37474F">Wheel Control</text>
    <text x="710" y="1130" font-size="16" text-anchor="middle" fill="#546E7A">Front Drive Motors</text>
    <text x="710" y="1150" font-size="16" text-anchor="middle" fill="#546E7A">Traction Control</text>
    <text x="710" y="1170" font-size="16" text-anchor="middle" fill="#546E7A">Speed Regulation</text>

    <rect x="900" y="1070" width="280" height="130" rx="12" fill="#FFF3E0" stroke="#F57C00" stroke-width="1"/>
    <text x="1040" y="1105" font-size="22" font-weight="bold" text-anchor="middle" fill="#37474F">Bucket Control</text>
    <text x="1040" y="1130" font-size="16" text-anchor="middle" fill="#546E7A">Dual-Link Actuator</text>
    <text x="1040" y="1150" font-size="16" text-anchor="middle" fill="#546E7A">Force Control</text>
    <text x="1040" y="1170" font-size="16" text-anchor="middle" fill="#546E7A">Position Tracking</text>

    <!-- Sensor Modules -->
    <rect x="200" y="1230" width="250" height="90" rx="10" fill="#E8F5E8" stroke="#4CAF50" stroke-width="1"/>
    <text x="325" y="1260" font-size="20" font-weight="bold" text-anchor="middle" fill="#37474F">IMU/Gyro</text>
    <text x="325" y="1285" font-size="16" text-anchor="middle" fill="#546E7A">6-DOF Sensing</text>
    <text x="325" y="1305" font-size="16" text-anchor="middle" fill="#546E7A">Vibration Filter</text>

    <!-- Hardware Interface -->
    <rect x="200" y="1350" width="980" height="120" rx="10" fill="#F5F5F5" stroke="#9E9E9E" stroke-width="1"/>
    <text x="690" y="1385" font-size="22" font-weight="bold" text-anchor="middle" fill="#37474F">Hardware Interface Layer</text>

    <rect x="250" y="1400" width="180" height="60" rx="8" fill="#FFECB3" stroke="#FFA000" stroke-width="1"/>
    <text x="340" y="1425" font-size="16" text-anchor="middle" fill="#37474F">H-Bridge</text>
    <text x="340" y="1445" font-size="14" text-anchor="middle" fill="#546E7A">Motor Driver</text>

    <rect x="480" y="1400" width="180" height="60" rx="8" fill="#FFECB3" stroke="#FFA000" stroke-width="1"/>
    <text x="570" y="1425" font-size="16" text-anchor="middle" fill="#37474F">Encoders</text>
    <text x="570" y="1445" font-size="14" text-anchor="middle" fill="#546E7A">Position Feedback</text>

    <rect x="710" y="1400" width="180" height="60" rx="8" fill="#FFECB3" stroke="#FFA000" stroke-width="1"/>
    <text x="800" y="1425" font-size="16" text-anchor="middle" fill="#37474F">Limit Switches</text>
    <text x="800" y="1445" font-size="14" text-anchor="middle" fill="#546E7A">Safety Stops</text>
  </g>

  <!-- NXT Rear Board Section -->
  <g id="nxt-rear-board">
    <rect x="1450" y="860" width="1250" height="640" rx="20" fill="url(#rearBoardGrad)" stroke="#FF9800" stroke-width="2"/>
    <text x="2075" y="910" font-size="30" font-weight="bold" text-anchor="middle" fill="#37474F">
      HKUST NXT-Dual-WL Rear Board
    </text>
    <text x="2075" y="940" font-size="18" text-anchor="middle" fill="#546E7A">
      Rear Actuation &amp; Articulation Control Unit
    </text>

    <!-- uORB Proxy Hub -->
    <rect x="1650" y="970" width="750" height="70" rx="12" fill="#E0F2F1" stroke="#00695C" stroke-width="1"/>
    <text x="2025" y="1000" font-size="22" font-weight="bold" text-anchor="middle" fill="#37474F">uORB Proxy Hub</text>
    <text x="2025" y="1025" font-size="16" text-anchor="middle" fill="#546E7A">Local Message Distribution &amp; Synchronization</text>

    <!-- Rear Kinematics EKF -->
    <rect x="1550" y="1070" width="320" height="130" rx="12" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1"/>
    <text x="1710" y="1105" font-size="22" font-weight="bold" text-anchor="middle" fill="#37474F">Rear Kinematics</text>
    <text x="1710" y="1130" font-size="16" text-anchor="middle" fill="#546E7A">Local EKF</text>
    <text x="1710" y="1150" font-size="16" text-anchor="middle" fill="#546E7A">Articulation Angle</text>
    <text x="1710" y="1170" font-size="16" text-anchor="middle" fill="#546E7A">Stability Monitor</text>

    <!-- Control Modules -->
    <rect x="1920" y="1070" width="280" height="130" rx="12" fill="#FFF3E0" stroke="#F57C00" stroke-width="1"/>
    <text x="2060" y="1105" font-size="22" font-weight="bold" text-anchor="middle" fill="#37474F">Wheel Control</text>
    <text x="2060" y="1130" font-size="16" text-anchor="middle" fill="#546E7A">Rear Drive Motors</text>
    <text x="2060" y="1150" font-size="16" text-anchor="middle" fill="#546E7A">Differential Lock</text>
    <text x="2060" y="1170" font-size="16" text-anchor="middle" fill="#546E7A">Speed Sync</text>

    <rect x="2250" y="1070" width="280" height="130" rx="12" fill="#FFF3E0" stroke="#F57C00" stroke-width="1"/>
    <text x="2390" y="1105" font-size="22" font-weight="bold" text-anchor="middle" fill="#37474F">Boom Control</text>
    <text x="2390" y="1130" font-size="16" text-anchor="middle" fill="#546E7A">Lift Actuator</text>
    <text x="2390" y="1150" font-size="16" text-anchor="middle" fill="#546E7A">Load Compensation</text>
    <text x="2390" y="1170" font-size="16" text-anchor="middle" fill="#546E7A">Height Tracking</text>

    <!-- Steering Module -->
    <rect x="2000" y="1230" width="350" height="90" rx="10" fill="#FCE4EC" stroke="#C2185B" stroke-width="1"/>
    <text x="2175" y="1260" font-size="20" font-weight="bold" text-anchor="middle" fill="#37474F">Steering Control</text>
    <text x="2175" y="1285" font-size="16" text-anchor="middle" fill="#546E7A">Articulated Joint</text>
    <text x="2175" y="1305" font-size="16" text-anchor="middle" fill="#546E7A">Angle Feedback</text>

    <!-- Sensor Modules -->
    <rect x="1550" y="1230" width="250" height="90" rx="10" fill="#E8F5E8" stroke="#4CAF50" stroke-width="1"/>
    <text x="1675" y="1260" font-size="20" font-weight="bold" text-anchor="middle" fill="#37474F">IMU/Gyro</text>
    <text x="1675" y="1285" font-size="16" text-anchor="middle" fill="#546E7A">6-DOF Sensing</text>
    <text x="1675" y="1305" font-size="16" text-anchor="middle" fill="#546E7A">Tilt Detection</text>

    <!-- Hardware Interface -->
    <rect x="1550" y="1350" width="980" height="120" rx="10" fill="#F5F5F5" stroke="#9E9E9E" stroke-width="1"/>
    <text x="2040" y="1385" font-size="22" font-weight="bold" text-anchor="middle" fill="#37474F">Hardware Interface Layer</text>

    <rect x="1600" y="1400" width="180" height="60" rx="8" fill="#FFECB3" stroke="#FFA000" stroke-width="1"/>
    <text x="1690" y="1425" font-size="16" text-anchor="middle" fill="#37474F">H-Bridge</text>
    <text x="1690" y="1445" font-size="14" text-anchor="middle" fill="#546E7A">Motor Driver</text>

    <rect x="1830" y="1400" width="180" height="60" rx="8" fill="#FFECB3" stroke="#FFA000" stroke-width="1"/>
    <text x="1920" y="1425" font-size="16" text-anchor="middle" fill="#37474F">Encoders</text>
    <text x="1920" y="1445" font-size="14" text-anchor="middle" fill="#546E7A">Position Feedback</text>

    <rect x="2060" y="1400" width="180" height="60" rx="8" fill="#FFECB3" stroke="#FFA000" stroke-width="1"/>
    <text x="2150" y="1425" font-size="16" text-anchor="middle" fill="#37474F">Servo Drive</text>
    <text x="2150" y="1445" font-size="14" text-anchor="middle" fill="#546E7A">Steering Motor</text>

    <rect x="2290" y="1400" width="180" height="60" rx="8" fill="#FFECB3" stroke="#FFA000" stroke-width="1"/>
    <text x="2380" y="1425" font-size="16" text-anchor="middle" fill="#37474F">Angle Sensor</text>
    <text x="2380" y="1445" font-size="14" text-anchor="middle" fill="#546E7A">Articulation</text>
  </g>

  <!-- Connection Lines -->
  <!-- Domain to Front Board -->
  <line x1="1050" y1="740" x2="675" y2="970" stroke="#1976D2" stroke-width="3" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
  <!-- Domain to Rear Board -->
  <line x1="1450" y1="740" x2="2025" y2="970" stroke="#1976D2" stroke-width="3" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
  <!-- Inter-board communication -->
  <line x1="1050" y1="1005" x2="1650" y2="1005" stroke="#4CAF50" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- Legend -->
  <g id="legend">
    <rect x="2450" y="80" width="300" height="40" rx="5" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1"/>
    <circle cx="2480" cy="100" r="5" fill="#1976D2"/>
    <text x="2500" y="105" font-size="14" fill="#37474F">Control Flow</text>
    <circle cx="2600" cy="100" r="5" fill="#4CAF50"/>
    <text x="2620" y="105" font-size="14" fill="#37474F">Data Exchange</text>
  </g>

  <!-- System Status Indicator -->
  <g id="status">
    <rect x="100" y="80" width="200" height="40" rx="5" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1"/>
    <circle cx="130" cy="100" r="8" fill="#4CAF50"/>
    <text x="150" y="105" font-size="14" fill="#37474F">System Active</text>
  </g>
</svg>
