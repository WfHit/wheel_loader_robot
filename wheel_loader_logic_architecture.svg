<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; fill: white; }
      .section-title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; fill: white; }
      .module-text { font-family: Arial, sans-serif; font-size: 11px; text-anchor: middle; fill: white; font-weight: bold; }
      .small-text { font-family: Arial, sans-serif; font-size: 9px; text-anchor: middle; fill: white; }

      /* Business-style color scheme - professional and corporate */
      .domain-control { fill: #2F4F4F; stroke: #1C3A3A; stroke-width: 2; }
      .front-board { fill: #4682B4; stroke: #2F5F8F; stroke-width: 2; }
      .rear-board { fill: #5F9EA0; stroke: #457B7D; stroke-width: 2; }

      /* Module type colors - business professional */
      .vla-module { fill: #708090; stroke: #556B7C; stroke-width: 1; }
      .rc-module { fill: #778899; stroke: #5D6B7A; stroke-width: 1; }
      .management-module { fill: #696969; stroke: #4A4A4A; stroke-width: 1; }
      .trajectory-module { fill: #6495ED; stroke: #4169E1; stroke-width: 1; }
      .safety-module { fill: #CD5C5C; stroke: #B22222; stroke-width: 1; }
      .ekf-module { fill: #9370DB; stroke: #7B68EE; stroke-width: 1; }
      .bridge-module { fill: #20B2AA; stroke: #008B8B; stroke-width: 1; }
      .control-module { fill: #A0522D; stroke: #8B4513; stroke-width: 1; }
      .hardware-module { fill: #D2B48C; stroke: #BC9A6A; stroke-width: 1; }

      /* Connection styles */
      .connection-line { stroke: #2F4F4F; stroke-width: 2; fill: none; stroke-dasharray: 5,5; }
    </style>
  </defs>

  <!-- Main Title -->
  <rect x="0" y="0" width="1200" height="60" fill="#263238"/>
  <text x="600" y="35" class="title" style="font-size: 24px;">Wheel Loader Robot - Distributed Architecture</text>

  <!-- Domain Control Section (Top) -->
  <rect x="220" y="80" width="760" height="230" class="domain-control" rx="15"/>
  <text x="600" y="110" class="section-title">CUAV X7Plus-WL Domain Controller Board</text>

  <!-- Top Row: Input Layer - Better Balanced to the Right -->
  <rect x="300" y="130" width="280" height="45" class="vla-module" rx="8"/>
  <text x="440" y="150" class="module-text">VlaProxy Driver</text>
  <text x="440" y="165" class="small-text">Vision-Language-Action Interface</text>

  <rect x="600" y="130" width="280" height="45" class="rc-module" rx="8"/>
  <text x="740" y="150" class="module-text">RC Input Controller</text>
  <text x="740" y="165" class="small-text">Manual Remote Control Interface</text>

  <!-- Middle Row: Core Management - Centered -->
  <rect x="360" y="190" width="480" height="50" class="management-module" rx="8"/>
  <text x="600" y="210" class="section-title">OperationModeManager</text>
  <text x="600" y="225" class="small-text">Autonomous ↔ Manual ↔ Emergency State Machine &amp; Decision Logic</text>

  <!-- Bottom Row: Communication Hub - Centered -->
  <rect x="430" y="260" width="340" height="40" class="bridge-module" rx="8"/>
  <text x="600" y="278" class="section-title">uORB UART Bridge</text>
  <text x="600" y="293" class="small-text">Distributed Message Router &amp; Cross-Board Communication</text>

  <!-- Front NXT Board (Bottom Left) -->
  <rect x="40" y="320" width="550" height="280" class="front-board" rx="15"/>
  <text x="315" y="345" class="section-title">HKUST NXT-Dual-WL Front Board</text>

  <!-- Front Board uORB Proxy -->
  <rect x="80" y="365" width="460" height="35" class="bridge-module" rx="8"/>
  <text x="310" y="380" class="section-title">uORB Proxy Hub</text>
  <text x="310" y="395" class="small-text">Message Router &amp; Distribution Hub</text>

  <!-- Front Board Control Layer -->
  <rect x="80" y="415" width="200" height="50" class="control-module" rx="8"/>
  <text x="180" y="435" class="module-text">WheelController</text>
  <text x="180" y="450" class="small-text">Front Drive System</text>

  <rect x="300" y="415" width="200" height="50" class="control-module" rx="8"/>
  <text x="400" y="435" class="module-text">BucketControl</text>
  <text x="400" y="450" class="small-text">Dual-Linkage Kinematics</text>

  <!-- Front Board Trajectory Layer -->
  <rect x="80" y="480" width="200" height="40" class="trajectory-module" rx="8"/>
  <text x="180" y="497" class="module-text">BucketTrajectory</text>
  <text x="180" y="512" class="small-text">Stage 1 &amp; 2 Control</text>

  <rect x="300" y="480" width="200" height="40" class="trajectory-module" rx="8"/>
  <text x="400" y="497" class="module-text">Motion Controller</text>
  <text x="400" y="512" class="small-text">Local Path Following</text>

  <!-- Front Board Hardware Layer -->
  <rect x="80" y="535" width="130" height="35" class="hardware-module" rx="5"/>
  <text x="145" y="550" class="small-text">H-Bridge</text>
  <text x="145" y="563" class="small-text">Motor Driver</text>

  <rect x="225" y="535" width="130" height="35" class="hardware-module" rx="5"/>
  <text x="290" y="550" class="small-text">Encoders</text>
  <text x="290" y="563" class="small-text">Position</text>

  <rect x="370" y="535" width="130" height="35" class="hardware-module" rx="5"/>
  <text x="435" y="550" class="small-text">Limit Sensors</text>
  <text x="435" y="563" class="small-text">Safety</text>

  <!-- Rear NXT Board (Bottom Right) -->
  <rect x="610" y="320" width="550" height="280" class="rear-board" rx="15"/>
  <text x="885" y="345" class="section-title">HKUST NXT-Dual-WL Rear Board</text>

  <!-- Rear Board uORB Proxy -->
  <rect x="650" y="365" width="460" height="35" class="bridge-module" rx="8"/>
  <text x="880" y="380" class="section-title">uORB Proxy Hub</text>
  <text x="880" y="395" class="small-text">Message Router &amp; Distribution Hub</text>

  <!-- Rear Board Control Layer -->
  <rect x="650" y="415" width="200" height="50" class="control-module" rx="8"/>
  <text x="750" y="435" class="module-text">DriveControl</text>
  <text x="750" y="450" class="small-text">Rear Drive System</text>

  <rect x="870" y="415" width="200" height="50" class="control-module" rx="8"/>
  <text x="970" y="435" class="module-text">BoomControl</text>
  <text x="970" y="450" class="small-text">Hydraulic Kinematics</text>

  <!-- Rear Board Trajectory Layer -->
  <rect x="650" y="480" width="200" height="40" class="trajectory-module" rx="8"/>
  <text x="750" y="497" class="module-text">BoomTrajectory</text>
  <text x="750" y="512" class="small-text">Z-Bar Control</text>

  <rect x="870" y="480" width="200" height="40" class="trajectory-module" rx="8"/>
  <text x="970" y="497" class="module-text">StabilityControl</text>
  <text x="970" y="512" class="small-text">Active Stability</text>

  <!-- Rear Board Hardware Layer -->
  <rect x="650" y="535" width="130" height="35" class="hardware-module" rx="5"/>
  <text x="715" y="550" class="small-text">Hydraulics</text>
  <text x="715" y="563" class="small-text">Valves</text>

  <rect x="795" y="535" width="130" height="35" class="hardware-module" rx="5"/>
  <text x="860" y="550" class="small-text">IMU Sensors</text>
  <text x="860" y="563" class="small-text">Orientation</text>

  <rect x="940" y="535" width="130" height="35" class="hardware-module" rx="5"/>
  <text x="1005" y="550" class="small-text">UWB Tracking</text>
  <text x="1005" y="563" class="small-text">Position</text>

  <!-- Enhanced Connection Lines -->
  <!-- Main communication flows from bridge to board proxies -->
  <line x1="600" y1="300" x2="310" y2="365" class="connection-line"/>
  <line x1="600" y1="300" x2="880" y2="365" class="connection-line"/>

  <!-- Hierarchical control flows -->
  <line x1="600" y1="240" x2="600" y2="260" class="connection-line"/>
  <line x1="440" y1="175" x2="600" y2="190" class="connection-line"/>
  <line x1="740" y1="175" x2="600" y2="190" class="connection-line"/>

</svg>
